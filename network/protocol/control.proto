syntax = "proto3";

package ngame.network;

option go_package = "github.com/2comjie/ngame/network/protocol;protocol";

enum BindCode {
  BIND_OK = 0;
  BIND_UNAUTHORIZED = 1;
}

// BindReq 使用 Header.Values["authorization"] = "Bearer <ticket>" 携带凭证。
message BindResponse {
  BindCode code = 1;
  uint32 heartbeat_interval_milli = 2;
}
